services:
  tradingview-alerts:
    build:
      context: .
      dockerfile: Dockerfile
    image: tradingview-price-alerts:latest
    container_name: tradingview_alerts
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    depends_on:
      - warp
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/live')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Cloudflare WARP Proxy Sidecar (Essential for regions where Discord is blocked, e.g., Turkey / BTK block)
  warp:
    image: caomingjun/warp:latest
    container_name: warp_proxy
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - MKNOD
      - AUDIT_WRITE
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      - WARP_SLEEP=5
    volumes:
      - warp_data:/var/lib/cloudflare-warp
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  warp_data:
